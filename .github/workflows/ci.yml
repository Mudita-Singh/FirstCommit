name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [client, server]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (${{ matrix.workspace }})
        run: npm run lint --if-present --workspace=${{ matrix.workspace }}

      - name: Run Tests (${{ matrix.workspace }})
        run: npm test --if-present --workspace=${{ matrix.workspace }}

      - name: Run Build (${{ matrix.workspace }})
        run: npm run build --if-present --workspace=${{ matrix.workspace }}
